services:
  - type: web
    name: webbuilder-backend
    env: python
    region: singapore
    # Free plan: sleeps after 15 idle minutes (an UptimeRobot check every 5 minutes keeps it
    # awake; visitors see sites' backup copies while it wakes). Switch to starter when paying.
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      # Postgres on Neon (free, doesn't expire; Render's free database is deleted after 30 days).
      # Use the direct (not "pooled") connection string from the Neon dashboard, with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      # Set these in the Render dashboard (they are no longer hard-coded in settings.py)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Razorpay > Settings > Webhooks: URL https://<backend>/api/users/subscriptions/webhook/,
      # events payment.captured + order.paid; paste the webhook secret here
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Public frontend address used in emailed links, e.g. https://jaalam.app
      - key: FRONTEND_URL
        sync: false
      # SMTP for real emails (password reset, plan reminders); without it emails only go to the logs
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Photo/music storage (S3-compatible, e.g. Cloudflare R2). Without these, uploads are lost on redeploy.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      # Only needed if a frontend calls this backend directly instead of through its /api proxy
      - key: FRONTEND_ORIGINS
        sync: false

# Daily jobs (reminders, site backup copies) run from .github/workflows/daily-jobs.yml
