services:
  - type: web
    name: webbuilder-backend
    env: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webbuilder-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"

databases:
  - name: webbuilder-db
    plan: starter
    databaseName: webbuilder
    user: webbuilder_user
