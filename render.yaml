services:
  - type: web
    name: webbuilder-backend
    env: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webbuilder-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      # Set these in the Render dashboard (they are no longer hard-coded in settings.py)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Razorpay > Settings > Webhooks: URL https://<backend>/api/users/subscriptions/webhook/,
      # events payment.captured + order.paid; paste the webhook secret here
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Only needed if a frontend calls this backend directly instead of through its /api proxy
      - key: FRONTEND_ORIGINS
        sync: false

databases:
  - name: webbuilder-db
    plan: starter
    databaseName: webbuilder
    user: webbuilder_user
