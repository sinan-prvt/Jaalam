# Daily backend jobs, run here because the free Render plan has no cron jobs.
# Add the same values as the Render web service under GitHub > Settings > Secrets and variables > Actions.
name: Daily jobs

on:
  schedule:
    - cron: '30 1 * * *'  # 07:00 IST
  workflow_dispatch:  # "Run workflow" button for a manual run

jobs:
  daily:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: 'False'
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      AWS_STORAGE_BUCKET_NAME: ${{ secrets.AWS_STORAGE_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
      AWS_S3_CUSTOM_DOMAIN: ${{ secrets.AWS_S3_CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Plan renewal reminders and expiries
        run: python manage.py sync_subscriptions
      - name: Lead follow-up reminders
        run: python manage.py send_follow_up_reminders
      - name: Refresh site backup copies
        run: python manage.py refresh_site_backups
